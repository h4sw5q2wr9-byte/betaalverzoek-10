  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #181324; color: #fff; font: 1rem system-ui, sans-serif; }
    main { width: min(92vw, 850px); padding: 1rem 0; text-align: center; }
    iframe { width: 100%; min-height: 200px; aspect-ratio: 16 / 9; display: block; border: 0; border-radius: 1rem; background: #000; }
    button[hidden] { display: none; }
    button, a { display: inline-block; margin: 1rem .4rem 0; padding: .7rem 1rem; color: inherit; }
    button { border: 0; border-radius: 2rem; background: #e0d5ff; color: #23153c; font: inherit; cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <iframe id="video" title="Rick Astley – Never Gonna Give You Up"
      src="https://www.youtube.com/embed/dQw4w9WgXcQ?autoplay=1&amp;mute=1&amp;playsinline=1&amp;enablejsapi=1&amp;origin=https%3A%2F%2Fh4sw5q2wr9-byte.github.io"
      allow="autoplay; encrypted-media; picture-in-picture; fullscreen"></iframe>
    <button id="sound" type="button" hidden>Geluid aan</button>
    <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ">Open op YouTube</a>
  </main>
  <script>
    window.onYouTubeIframeAPIReady = function () {
      const sound = document.getElementById('sound');
      new YT.Player('video', {
        events: {
          onReady: ({ target: player }) => {
            player.mute();
            player.playVideo();
            sound.hidden = false;
            sound.addEventListener('click', () => {
              player.unMute();
              player.playVideo();
            });
          }
        }
      });
    };
  </script>
  <script async src="https://www.youtube.com/iframe_api"></script>
</body>
