<!doctype html>
<html lang="nl" prefix="og: https://ogp.me/ns#">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Claim je € 10,00</title>
  <meta name="description" content="Er staat een tientje voor je klaar.">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="nl_NL">
  <meta property="og:title" content="Claim je € 10,00">
  <meta property="og:description" content="Er staat een tientje voor je klaar.">
  <meta property="og:url" content="https://h4sw5q2wr9-byte.github.io/betaalverzoek-10/?v=10">
  <meta property="og:image" content="https://h4sw5q2wr9-byte.github.io/betaalverzoek-10/euro-mini.jpg">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:width" content="160">
  <meta property="og:image:height" content="160">
  <meta property="og:image:alt" content="Wit euroteken op een groenblauw betaalkaartje.">
  <link rel="icon" type="image/jpeg" sizes="160x160" href="euro-mini.jpg">
  <style>
    :root { color-scheme: light; font: 1rem system-ui, sans-serif; color: #172f2a; background: #eef3ef; }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; }
    [hidden] { display: none !important; }
    .screen { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: clamp(1rem, 4vw, 3rem); }
    .receipt { width: min(100%, 57rem); display: grid; grid-template-columns: 2fr 3fr; border-radius: 1.75rem; overflow: hidden; background: white; border: 1px solid #dbe5de; box-shadow: 0 1.6rem 4rem #183d3315; }
    .visual { position: relative; isolation: isolate; overflow: hidden; min-height: 12rem; display: grid; place-items: center; background: radial-gradient(ellipse at 20% 5%, #367c66, transparent 75%), #123d33; }
    .visual::before, .visual::after { content: ""; position: absolute; z-index: -1; width: 22rem; aspect-ratio: 1; border-radius: 50%; border: 1px solid #d1f7dd30; }
    .visual::before { top: -10rem; right: -10rem; box-shadow: 0 0 0 2rem #d1f7dd0d, 0 0 0 4rem #d1f7dd0a; }
    .visual::after { bottom: -14rem; left: -8rem; }
    .symbol { display: grid; place-items: center; width: clamp(5rem, 12vw, 7rem); aspect-ratio: 1; border: 1px solid #def7dd; border-radius: 32%; color: #194437; background: #cfebd4; font-size: clamp(2.5rem, 6vw, 3.8rem); font-weight: 650; line-height: 1; box-shadow: 0 .8rem 2rem #072a2455; }
    .content { padding: clamp(1.6rem, 6vw, 4rem); }
    h1 { margin: 0; font-size: 1rem; font-weight: 650; color: #426458; }
    .amount { margin: .7rem 0 .95rem; font-size: clamp(3rem, 8vw, 5rem); font-weight: 690; letter-spacing: -.07em; line-height: 1.03; font-variant-numeric: tabular-nums; }
    .description { margin: 0; color: #4c625b; line-height: 1.55; }
    .action { margin-top: 2rem; padding-top: 1.4rem; border-top: 1px solid #e5ebe7; }
    button { width: 100%; min-height: 3.25rem; padding: .75rem 1rem; border: 0; border-radius: .7rem; background: #1c5949; color: #fff; font: inherit; font-weight: 650; cursor: pointer; }
    button:hover { background: #154739; }
    button:focus-visible, video:focus-visible { outline: 3px solid #438c70; outline-offset: 4px; }
    body.playing { background: #000; }
    video { display: block; width: 100%; height: 100vh; height: 100dvh; object-fit: contain; }
    @media (max-width: 40rem) {
      .receipt { max-width: 28rem; grid-template-columns: 1fr; }
      .visual { min-height: 9rem; }
      .action { margin-top: 1.5rem; }
    }
  </style>
</head>
<body>
  <main class="screen" id="claim">
    <section class="receipt" aria-labelledby="request-title">
      <div class="visual" aria-hidden="true"><span class="symbol">€</span></div>
      <div class="content">
        <h1 id="request-title">Ontvangstverzoek</h1>
        <p class="amount" id="request-amount">€ 10,00</p>
        <p class="description" id="request-description">Er staat een tientje voor je klaar.</p>
        <div class="action">
          <button id="claim-button" type="button">Doorgaan</button>
        </div>
      </div>
    </section>
  </main>
  <video id="rickroll" hidden playsinline controls loop tabindex="0" preload="auto" aria-label="Rick Astley danst in Never Gonna Give You Up">
    <source src="rickroll-dans.mp4" type="video/mp4">
  </video>
  <script>
    const amountParam = new URLSearchParams(window.location.search).get('amount');
    if (amountParam && /^\d{1,4}([.,]\d{1,2})?$/.test(amountParam)) {
      const amount = Number(amountParam.replace(',', '.'));
      if (amount > 0 && amount !== 10) {
        const displayAmount = new Intl.NumberFormat('nl-NL', {
          style: 'currency',
          currency: 'EUR',
        }).format(amount);
        document.getElementById('request-amount').textContent = displayAmount;
        document.getElementById('request-description').textContent =
          'Open je ontvangstverzoek om verder te gaan.';
        document.title = 'Claim je ' + displayAmount;
      }
    }

    const claim = document.getElementById('claim');
    const video = document.getElementById('rickroll');
    document.getElementById('claim-button').addEventListener('click', () => {
      video.hidden = false;
      claim.hidden = true;
      document.body.classList.add('playing');
      video.play().catch(() => {});
      video.focus({ preventScroll: true });
    });
  </script>
</body>
</html>
